# Serves the built frontend and forwards /api to the API container.
# This is the stack's only published port; put your own reverse proxy in front of it.

# Keep the original scheme when another proxy (nginx, Cloudflare) sits in front.
map $http_x_forwarded_proto $featherkeeper_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The API enforces the real photo size limit (MAX_UPLOAD_MB, default 100 MB).
  # This must be a little larger to allow for the upload's form overhead.
  client_max_body_size 110m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $featherkeeper_proto;
    proxy_set_header X-Forwarded-Host $host;
    # eBird imports and photo processing can take a while.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    # Stream uploads straight to the API instead of buffering them inside this container.
    proxy_request_buffering off;
  }

  # Hashed build files never change, so browsers can keep them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else is the single-page app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
