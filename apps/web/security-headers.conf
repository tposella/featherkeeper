# Browser security headers for every response (included in each location in nginx.conf, because
# nginx drops server-level add_header lines wherever a location sets its own).
#
# frame-ancestors / X-Frame-Options: other sites can't show Featherkeeper inside a frame (clickjacking).
# nosniff: browsers trust the declared file types. Referrer-Policy: other sites only see your address,
# not page paths. Permissions-Policy: no camera or microphone; location only for "Use my location".
# HSTS (https only) belongs on your HTTPS proxy or Cloudflare, since this container may serve plain http.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
