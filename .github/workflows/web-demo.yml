# Builds the frontend in demo mode (sample data, no backend), screenshots every screen,
# and publishes it to GitHub Pages so anyone can click through it.
# Screenshots and logs are also pushed to the `ci-report` branch for review.
name: Web demo

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
      REPORT: ${{ github.workspace }}/ci-report
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          mkdir -p "$REPORT/screenshots"
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee "$REPORT/install.log"
          cp package-lock.json "$REPORT/package-lock.json"

      - name: Build demo
        run: |
          set -o pipefail
          VITE_DEMO=true npm run build 2>&1 | tee "$REPORT/build.log"

      - name: Make test photos with camera metadata
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq libimage-exiftool-perl imagemagick >/dev/null
          mkdir -p "$REPORT/fixtures"
          cd "$REPORT/fixtures"
          # A DSLR-style JPEG: date with time zone, GPS, camera and lens.
          convert -size 1200x800 gradient:skyblue-darkgreen camera.jpg
          exiftool -q -overwrite_original -Make=Canon -Model="Canon EOS R7" -LensModel="RF100-500mm F4.5-7.1 L IS USM" \
            -DateTimeOriginal="2024:05:18 07:42:10" -OffsetTimeOriginal="-06:00" -CreateDate="2024:05:18 07:42:10" \
            -GPSLatitude=51.1652 -GPSLatitudeRef=N -GPSLongitude=114.3824 -GPSLongitudeRef=W camera.jpg
          # A phone-style JPEG: date only in DateTimeOriginal, no GPS.
          convert -size 1000x750 gradient:khaki-sienna phone.jpg
          exiftool -q -overwrite_original -Make=Apple -Model="iPhone 15" -DateTimeOriginal="2025:09:02 18:05:33" phone.jpg
          # A Lightroom-style export: date only in XMP and ModifyDate.
          convert -size 900x600 gradient:gray-white xmp.jpg
          exiftool -q -overwrite_original -all= -XMP-xmp:CreateDate="2023:06:11 05:58:00" -XMP-photoshop:DateCreated="2023:06:11 05:58:00" -ModifyDate="2023:06:12 20:00:00" xmp.jpg
          for f in *.jpg; do echo "== $f"; exiftool -s -DateTimeOriginal -CreateDate -ModifyDate -DateCreated -GPSPosition -Model "$f"; done | tee metadata.txt

      - name: Take screenshots
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 "http://localhost:4173$VITE_BASE"
          FIXTURES="$REPORT/fixtures" node scripts/screenshots.mjs "http://localhost:4173$VITE_BASE" "$REPORT/screenshots" 2>&1 | tee "$REPORT/screenshots.log"

      - name: Publish report to the ci-report branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          cd "$REPORT"
          echo "commit: ${{ github.sha }}" > status.txt
          echo "build: ${{ job.status }}" >> status.txt
          git init -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
