# Builds the frontend in demo mode (sample data, no backend), screenshots every screen,
# and publishes it to GitHub Pages so anyone can click through it.
name: Web demo

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build demo
        run: npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Take screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173/${{ github.event.repository.name }}/
          node scripts/screenshots.mjs http://localhost:4173/${{ github.event.repository.name }}/ ../../screenshots
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
