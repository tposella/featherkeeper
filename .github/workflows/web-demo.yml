# Builds the frontend in demo mode (sample data, no backend), screenshots every screen,
# and publishes it to GitHub Pages so anyone can click through it.
# Screenshots and logs are also pushed to the `ci-report` branch for review.
name: Web demo

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
      REPORT: ${{ github.workspace }}/ci-report
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          mkdir -p "$REPORT/screenshots"
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee "$REPORT/install.log"
          cp package-lock.json "$REPORT/package-lock.json"

      - name: Build demo
        run: |
          set -o pipefail
          VITE_DEMO=true npm run build 2>&1 | tee "$REPORT/build.log"

      - name: Take screenshots
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 "http://localhost:4173$VITE_BASE"
          node scripts/screenshots.mjs "http://localhost:4173$VITE_BASE" "$REPORT/screenshots" 2>&1 | tee "$REPORT/screenshots.log"

      - name: Publish report to the ci-report branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          cd "$REPORT"
          echo "commit: ${{ github.sha }}" > status.txt
          echo "build: ${{ job.status }}" >> status.txt
          git init -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
