# Diagnostic: what GitHub reports as this repository's contributors, next to who actually authored
# the commits on main. Pushed to the ci-report-contributors branch. Runs when this file changes.
name: Contributors check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/contributors.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare GitHub's contributor list with the commit history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report
          {
            echo "== GitHub API: /contributors (includes anonymous, i.e. emails not linked to an account)"
            gh api "repos/${{ github.repository }}/contributors?anon=1&per_page=100" \
              --jq '.[] | "\(.login // .name // "?")  type=\(.type)  email=\(.email // "-")  contributions=\(.contributions)"' || echo "(request failed)"
            echo
            echo "== GitHub API: /stats/contributors (the Insights graph)"
            gh api "repos/${{ github.repository }}/stats/contributors" --jq '.[] | "\(.author.login)  commits=\(.total)"' || echo "(not computed yet)"
            echo
            echo "== Commit authors and committers on main (from git)"
            git log --format='%an <%ae>' | sort | uniq -c
            git log --format='committer: %cn <%ce>' | sort | uniq -c
            echo
            echo "== Commit messages mentioning Claude or Anthropic: $(git log --format=%B | grep -ci 'claude\|anthropic')"
          } | tee report/contributors.txt
      - name: Publish report to the ci-report-contributors branch
        run: |
          cd report
          echo "commit: ${{ github.sha }}" > status.txt
          git init -q -b ci-report-contributors
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Contributors check for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report-contributors
