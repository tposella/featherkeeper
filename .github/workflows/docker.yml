# Builds the Docker images, starts the full stack with docker compose exactly as a
# self-hoster would, and runs deploy/smoke-test.sh against it.
# The log is pushed to the ci-report-docker branch.
name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.env.example'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPORT: ${{ github.workspace }}/ci-report
    steps:
      - uses: actions/checkout@v4

      - name: Configure .env like a fresh install
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          mkdir -p "$REPORT"
          cp .env.example .env
          sed -i "s#^PUBLIC_URL=.*#PUBLIC_URL=http://localhost:8080#" .env
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=$(openssl rand -hex 24)#" .env
          sed -i "s#^EBIRD_API_KEY=.*#EBIRD_API_KEY=${EBIRD_API_KEY}#" .env

      - name: Build and start the stack
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee "$REPORT/compose.log"
          docker compose ps | tee -a "$REPORT/compose.log"

      - name: Smoke test
        run: |
          set -o pipefail
          bash deploy/smoke-test.sh http://localhost:8080 2>&1 | tee "$REPORT/smoke.log"

      - name: Security headers on pages, assets and the API
        run: |
          set -o pipefail
          ASSET=$(curl -s http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          for path in / "$ASSET" /api/health; do
            H=$(curl -sI "http://localhost:8080$path")
            for h in content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy; do
              echo "$H" | grep -qi "^$h:" || { echo "missing $h on $path"; exit 1; }
            done
            echo "$path: all security headers present" | tee -a "$REPORT/headers.log"
          done

      - name: HEIC (iPhone) photos decode inside the API image
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -y -q libheif-examples libheif-plugin-x265 libimage-exiftool-perl > /dev/null
          # A JPEG with a capture date, made by sharp in the container, turned into HEIC here.
          docker compose exec -T api node -e "require('sharp')({create:{width:640,height:480,channels:3,background:'#5a783c'}}).withExif({IFD0:{Make:'Apple',Model:'iPhone 15'},IFD2:{DateTimeOriginal:'2024:05:18 07:42:10'}}).jpeg().toFile('/tmp/in.jpg').then(()=>console.log('jpeg ok'))"
          docker compose cp api:/tmp/in.jpg /tmp/in.jpg
          heif-enc -q 50 -o /tmp/test.heic /tmp/in.jpg
          # Like an iPhone photo: capture date, camera and GPS in the HEIC's EXIF.
          exiftool -q -overwrite_original -Make=Apple -Model='iPhone 15' -DateTimeOriginal='2024:05:18 07:42:10' \
            -GPSLatitude=51.1652 -GPSLatitudeRef=N -GPSLongitude=114.3824 -GPSLongitudeRef=W /tmp/test.heic
          docker compose cp /tmp/test.heic api:/tmp/test.heic
          exiftool -a -G1 -s -Make -Model -DateTimeOriginal -GPSLatitude /tmp/test.heic | tee "$REPORT/heic-tags.log"
          docker compose exec -T api node --input-type=module -e "import exifr from 'exifr'; import { readFile } from 'node:fs/promises'; for (const [k, v] of [['path', '/tmp/test.heic'], ['buffer', await readFile('/tmp/test.heic')]]) { try { const t = await exifr.parse(v, { tiff: true, exif: true, gps: true }); console.log(k, JSON.stringify({ Make: t?.Make, DateTimeOriginal: t?.DateTimeOriginal, lat: t?.latitude })); } catch (e) { console.log(k, 'error', e.message); } }" 2>&1 | tee -a "$REPORT/heic-tags.log" || true
          docker compose exec -T api node --input-type=module -e "import { processImage } from '/app/src/lib/images.js'; const r = await processImage('/tmp/test.heic'); console.log(JSON.stringify({ ext: r.ext, width: r.width, height: r.height, takenAt: r.takenAt, camera: r.camera, latitude: r.latitude, longitude: r.longitude, thumb: r.thumb.length })); if (r.ext !== 'heic' || r.width !== 640 || !r.takenAt || r.latitude !== 51.1652) process.exit(1);" 2>&1 | tee "$REPORT/heic.log"

      - name: Collect logs
        if: always()
        run: |
          docker compose logs --no-color > "$REPORT/containers.log" 2>&1 || true
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep featherkeeper >> "$REPORT/compose.log" || true

      - name: Publish report to the ci-report-docker branch
        if: always()
        run: |
          cd "$REPORT"
          echo "commit: ${{ github.sha }}" > status.txt
          echo "stack: ${{ job.status }}" >> status.txt
          git init -q -b ci-report-docker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Docker CI report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report-docker
