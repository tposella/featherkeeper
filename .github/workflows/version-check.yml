# Every update to the app gets a new version (see docs/releasing.md). This fails a push to main
# when the app has changed since the last release (the newest v* tag) but the version in
# apps/api/package.json is still that release's, or when the version has no CHANGELOG.md section.
# Fixes to a version that isn't released yet can keep its number. Docs, tests and CI don't count.
# The result is pushed to the ci-report-version branch.
name: Version check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is the version bumped for app changes?
        id: v
        run: |
          set -euo pipefail
          mkdir -p report
          # Compare with the last release; before the first release, with the previous commit.
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || git rev-parse HEAD~1)
          OLD=$(git show "$BASE:apps/api/package.json" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).version))" 2>/dev/null || echo none)
          NEW=$(node -p "require('./apps/api/package.json').version")
          WEB=$(node -p "require('./apps/web/package.json').version")
          # The app itself: server and web code, images, and the compose file. Not tests, docs or CI.
          CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            'apps/api/src/**' 'apps/api/Dockerfile' 'apps/api/package.json' \
            'apps/web/src/**' 'apps/web/index.html' 'apps/web/public/**' 'apps/web/nginx.conf' 'apps/web/Dockerfile' 'apps/web/package.json' \
            'services/identifier/app.py' 'services/identifier/Dockerfile' 'services/identifier/requirements.txt' \
            'docker-compose.yml' || true)
          {
            echo "base: $BASE"
            echo "version: $OLD -> $NEW (web $WEB)"
            echo "app files changed:"
            echo "${CHANGED:-  (none)}"
          } | tee report/version.log
          FAIL=""
          [ "$NEW" = "$WEB" ] || FAIL="apps/web/package.json ($WEB) doesn't match apps/api/package.json ($NEW). Use scripts/bump-version.mjs."
          if [ -z "$FAIL" ] && [ -n "$CHANGED" ] && [ "$OLD" = "$NEW" ]; then
            FAIL="The app changed but the version is still $NEW. Run: node scripts/bump-version.mjs patch (or minor)"
          fi
          if [ -z "$FAIL" ] && [ "$OLD" != "$NEW" ] && ! grep -q "^## \[$NEW\]" CHANGELOG.md; then
            FAIL="Version $NEW has no section in CHANGELOG.md."
          fi
          if [ -n "$FAIL" ]; then
            echo "::error::$FAIL" ; echo "result: FAIL: $FAIL" | tee -a report/version.log ; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "result: ok" | tee -a report/version.log ; echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish report to the ci-report-version branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd report
          echo "commit: ${{ github.sha }}" > status.txt
          echo "version-check: ${{ steps.v.outputs.ok == 'true' && 'success' || 'failure' }}" >> status.txt
          git init -q -b ci-report-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Version check for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report-version
      - name: Fail if the version wasn't bumped
        if: steps.v.outputs.ok != 'true'
        run: exit 1
