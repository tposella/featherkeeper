# Featherkeeper. Settings come from .env (copy .env.example). Only the web port is published.
#
#   docker compose pull && docker compose up -d     ready-made images from ghcr.io (recommended)
#   docker compose up -d --build                    build the images yourself from this folder
#
# FEATHERKEEPER_TAG in .env picks the release: "beta" (default, the newest release), "latest"
# (the newest stable release) or an exact version such as 0.1.0-beta.1.

name: featherkeeper

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-featherkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-featherkeeper}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${FEATHERKEEPER_IMAGES:-ghcr.io/tposella}/featherkeeper-api:${FEATHERKEEPER_TAG:-beta}
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATA_DIR: /data
    volumes:
      # A named volume by default. Set PHOTOS_DIR in .env to a host folder (owned by uid 1000) to use that instead.
      - ${PHOTOS_DIR:-photos}:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${FEATHERKEEPER_IMAGES:-ghcr.io/tposella}/featherkeeper-web:${FEATHERKEEPER_TAG:-beta}
    build: ./apps/web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  # AI species identification (BioCLIP 2). Off unless COMPOSE_PROFILES=ai is set in .env.
  # Uses about 2.5 GB of RAM; the model downloads into the "models" volume on first start.
  identifier:
    profiles: [ai]
    image: ${FEATHERKEEPER_IMAGES:-ghcr.io/tposella}/featherkeeper-identifier:${FEATHERKEEPER_TAG:-beta}
    build: ./services/identifier
    restart: unless-stopped
    environment:
      MODEL: ${IDENTIFIER_MODEL:-hf-hub:imageomics/bioclip-2}
      TEMPERATURE: ${IDENTIFIER_TEMPERATURE:-1.0}
      TORCH_THREADS: ${IDENTIFIER_THREADS:-}
    volumes:
      - models:/models

volumes:
  db-data:
  photos:
  models:
