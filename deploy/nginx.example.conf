# Example server block for an nginx reverse proxy in front of Featherkeeper.
# Replace birds.example.com and 192.168.1.50 with your hostname and the Docker LXC's IP.
#
# With Cloudflare Tunnel, cloudflared terminates HTTPS and sends plain HTTP to nginx,
# so this block listens on port 80 and passes the original scheme along.

server {
  listen 80;
  server_name birds.example.com;

  # Must be at least MAX_UPLOAD_MB from .env (nginx's default of 1 MB rejects photos).
  client_max_body_size 100m;

  location / {
    proxy_pass http://192.168.1.50:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare sends X-Forwarded-Proto: https; keep it so secure cookies work.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
